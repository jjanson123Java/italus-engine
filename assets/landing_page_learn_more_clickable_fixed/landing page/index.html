<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITALUS Narrative Studio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page-shell" aria-label="ITALUS Narrative Studio landing page">
    <img class="background-art" src="assets/library-desk-bg.png" alt="Narrative Studio library desk background">

    <header class="site-header" aria-label="Primary navigation">
      <a class="brand-link" href="#" aria-label="ITALUS home">
        <img src="assets/italus-tree-circle.png" alt="" class="brand-mark">
        <span class="brand-name">ITALUS</span>
      </a>

      <nav class="main-nav" aria-label="Main menu">
        <a href="#file">File</a>
        <a href="#project">Project</a>
        <a href="#engine">Engine</a>
        <a href="#generate">Generate</a>
        <a href="#validation">Validation</a>
        <a href="#view">View</a>
        <a href="#settings">Settings</a>
        <a href="#help">Help</a>
      </nav>

      <p class="header-quote">
        The longest stories<br>
        begin with timeless roots.<br>
        <span>— ITALUS, 789 AD</span>
      </p>
    </header>

    <section class="project-tiles" aria-label="Project actions">
      <a class="project-tile tile-one" href="#new-project" aria-label="Create a new project">
        <img src="assets/tile-new-project.png" alt="New Project — Create New">
      </a>
      <a class="project-tile tile-two" href="#existing-project" aria-label="Open an existing project">
        <img src="assets/tile-existing-project.png" alt="Existing Project — Open Project">
      </a>
      <a class="project-tile tile-three" href="#archived-project" aria-label="Browse archived projects">
        <img src="assets/tile-archived-project.png" alt="Archived Project — Browse Archive">
      </a>
    </section>

    <a class="learn-more-link" href="#learn-more" aria-label="Learn more about Italus">
      Learn More
    </a>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
