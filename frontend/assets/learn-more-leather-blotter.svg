<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="Old leather writing desk blotter texture">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18352c"/>
      <stop offset="0.42" stop-color="#0b221d"/>
      <stop offset="1" stop-color="#04110f"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#5d3f22" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#2b2115" stop-opacity=".16"/>
      <stop offset="1" stop-color="#020807" stop-opacity=".70"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="789"/>
      <feColorMatrix type="saturate" values=".22"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
    </filter>
    <filter id="softNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="1230"/>
      <feColorMatrix type="matrix" values="0.60 0 0 0 0.08  0 0.45 0 0 0.07  0 0 0.25 0 0.03  0 0 0 .18 0"/>
    </filter>
    <pattern id="tooling" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M8 8h94v94H8z" fill="none" stroke="#d6a85f" stroke-opacity=".055" stroke-width="2"/>
      <path d="M25 55c18-22 42-22 60 0-18 22-42 22-60 0Z" fill="none" stroke="#d6a85f" stroke-opacity=".045" stroke-width="1.5"/>
      <circle cx="55" cy="55" r="5" fill="#d6a85f" fill-opacity=".035"/>
    </pattern>
    <linearGradient id="edgeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6a85f" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#d6a85f" stop-opacity=".06"/>
      <stop offset="1" stop-color="#d6a85f" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1200" fill="url(#base)"/>
  <rect width="1800" height="1200" fill="url(#warm)"/>
  <rect width="1800" height="1200" filter="url(#softNoise)" opacity=".74"/>
  <rect width="1800" height="1200" filter="url(#grain)" opacity=".90"/>
  <rect x="84" y="72" width="1632" height="1056" rx="46" fill="#061a16" fill-opacity=".32" stroke="#d6a85f" stroke-opacity=".24" stroke-width="3"/>
  <rect x="118" y="106" width="1564" height="988" rx="32" fill="none" stroke="#d6a85f" stroke-opacity=".115" stroke-width="2"/>
  <rect x="150" y="138" width="1500" height="924" rx="24" fill="url(#tooling)" opacity=".62"/>
  <path d="M110 102h1580M110 1098h1580" stroke="url(#edgeGold)" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  <path d="M104 122c120 38 208 14 310 22 136 10 229 58 374 27 165-35 278-45 420-14 152 34 282-4 466 26" fill="none" stroke="#d6a85f" stroke-opacity=".055" stroke-width="14"/>
  <path d="M168 1000c120-42 214-18 322-26 138-10 235-56 380-20 166 41 285 42 438 8 148-34 256 2 388-30" fill="none" stroke="#020807" stroke-opacity=".28" stroke-width="22"/>
  <rect width="1800" height="1200" fill="none" stroke="#020807" stroke-opacity=".70" stroke-width="90"/>
</svg>
